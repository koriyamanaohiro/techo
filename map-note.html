$('share').onclick=async()=>{const b=$('share');b.disabled=true;b.textContent='画像作成中…';try{const blob=await exportImage(),file=new File([blob],`map-note-${pageIndex+1}.png`,{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'地図ノート'});return}catch(e){if(e.name==='AbortError')return}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`map-note-${pageIndex+1}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('画像を保存しました。LINEで添付してください')}catch(e){toast('画像共有に失敗しました。地図が読み込まれているか確認してください')}finally{b.disabled=false;b.textContent='LINE転送'}};setMode('move');draw();setTimeout(()=>map.invalidateSize(),250)})();
</script></body></html>
