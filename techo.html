<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f2e9">
<title>場所の手帳</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
:root{color:#263b35;background:#f5f2e9;font:16px system-ui,sans-serif}
body{margin:0;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px,env(safe-area-inset-left))}
main{max-width:960px;margin:auto} h1{font-family:Georgia,"Yu Mincho",serif;font-size:1.65rem;margin:0}
button,input,textarea,select{font:inherit;color:inherit} button,input,select{min-height:44px;border:1px solid #aab5ac;border-radius:9px;background:#fffdf7;padding:6px 10px}
button{cursor:pointer} button:disabled{opacity:.45} button[aria-pressed="true"],.primary{background:#2d554a;color:white}
#book{min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;padding:5px 0}
.nav,.row,.mapbar,.tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nav{justify-content:space-between;touch-action:pan-y;flex-wrap:nowrap}
.nav button,.nav select{font-size:clamp(17px,5vw,21px);font-weight:600;min-height:34px;padding:2px 6px;white-space:nowrap}
.nav select{min-width:0}
.upper{display:flex;flex-direction:column;gap:5px}
textarea{width:100%;height:clamp(76px,14dvh,160px);resize:none;border:1px solid #aab5ac;border-radius:10px;background:#fffdf7;padding:6px 9px;font-size:18px;line-height:1.4;overflow-y:auto}
.tools{justify-content:flex-end}.danger{color:#923b34}
#book .tools button,.mapbar button,.mapbar select{min-height:34px;padding:2px 6px;font-size:16px}
.mapbar{justify-content:flex-start;flex-wrap:nowrap;gap:4px;overflow-x:auto}
.mapbar button,.mapbar select{flex:none;padding-inline:5px;white-space:nowrap}
.mapbar .danger{margin-inline-start:auto}
#map{flex:1 0 220px;border:1px solid #b7c0b4;border-radius:12px;background:#e6eae0}
 .row{display:grid;grid-template-columns:min(34%,7.25rem) min(20%,4.25rem) repeat(2,minmax(0,1fr));gap:0 5px;align-items:center}
.row label{font-size:15px;font-weight:600;min-width:0;line-height:1.1}
.row input{display:block;width:100%;min-width:0;height:29px;min-height:29px;padding:0 4px;font-size:16px;text-align:center}
#time{width:calc(100% - 8px)}
.row input::-webkit-date-and-time-value{margin:0;text-align:center}
.row button{grid-row:1 / 3;width:100%;height:36px;min-height:36px;padding:0 2px;font-size:17px;font-weight:600;white-space:nowrap}
#timerStart{grid-column:3;background:#236448;color:white}
#timerEnd{grid-column:4;background:#a43d30;color:white}
#timerReadout{grid-column:1 / 3;grid-row:2;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums;text-align:center}
#records{width:min(560px,calc(100% - 20px));max-height:90dvh}
.recordHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#recordDays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}
#recordDays button{padding:4px;touch-action:pan-y;user-select:none;font-variant-numeric:tabular-nums}
#recordDays span{display:block;font-size:.8rem}
#recordEdit label{display:block;margin-bottom:6px}
#recordEdit input{width:100%;margin-top:4px}
.status{font-size:.82rem;margin:4px 0;color:#425a50}.status:empty{display:none}
#gate{max-width:410px;margin: min(15vh,130px) auto 0;padding:23px;border:1px solid #bfc8bc;border-radius:17px;background:#fffdf7}
#gate label,#gate input{display:block;width:100%;margin:8px 0}#gate button{margin-top:6px}
dialog{border:1px solid #bfc8bc;border-radius:15px;max-width:calc(100% - 30px);color:inherit;background:#fffdf7}dialog::backdrop{background:#172c25aa}
@media(min-width:700px){body{padding-inline:24px}.upper{gap:8px}textarea{height:80px}}
#drawSurface{position:absolute;inset:0;z-index:1100;touch-action:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
</style>
<main>
<section id="gate">
<h1>パスワード</h1>
<p id="intro"></p>
<form id="access">
<label>パスワード<input id="password" type="password" required></label>
<label id="repeatLabel">パスワードをもう一度入力<input id="repeat" type="password" autocomplete="new-password"></label>
<button class="primary" id="enter"></button>
</form>
<p id="gateStatus" class="status" role="status"></p>
</section>
<section id="book" hidden>
<div class="upper">
<nav id="nav" class="nav" aria-label="ページめくり"><button id="prev" aria-label="前のページ">◁</button><select id="page" aria-label="ページ"></select><button id="next" aria-label="次のページ">▷</button><button id="recordsLink" aria-label="時間の記録">時間</button><button id="lock">ロック</button></nav>
<div class="row"><label>日付<input type="date" id="date"></label><label>時刻<input type="time" id="time"></label><button id="timerStart">始め</button><button id="timerEnd" disabled>終了</button>
<output id="timerReadout" aria-label="経過時間">00:00:00</output></div>
<textarea id="memo" aria-label="メモ" placeholder="ここにメモを書く"></textarea>
<p class="status" id="saveStatus" role="status"></p>
</div>
<div class="mapbar" role="group" aria-label="地図とメモの操作">
<button id="locate">現在地</button>
<button id="mark" aria-pressed="false">丸印</button>
<select id="color" aria-label="丸印の色"><option value="#bf302f">赤</option><option value="#205cb5">青</option><option value="#267844">緑</option></select>
<button id="draw" aria-pressed="false">線</button>
<button id="undoStroke" aria-label="手書き線を一筆戻す" disabled>戻す</button>
<button id="undo" aria-label="一括消去を取り消す" hidden>取消</button>
<button class="danger" id="clear" aria-label="メモと地図の印を消去">消去</button>
</div>
<div id="map" aria-label="OpenStreetMap"><div id="drawSurface" hidden></div></div>
<p class="status" id="mapStatus" role="status"></p>
</section>
<dialog id="confirmClear"><form method="dialog"><p id="clearText"></p><div class="tools"><button value="cancel" autofocus>キャンセル</button><button class="danger" value="clear">消去する</button></div></form></dialog>
<dialog id="records">
<div class="recordHead"><strong>時間の記録</strong><button id="recordsClose">手帳に戻る</button></div>
<label>表示月 <input id="recordMonth" type="month"></label>
<p id="recordTotal"></p>
<p class="status">日別の時間は長押しで修正できます。</p>
<div id="recordDays"></div>
</dialog>
<dialog id="recordEdit">
<form id="editForm">
<p id="editDate"></p>
<label>時間（時:分:秒） <input id="editDuration" required placeholder="1:30:00" pattern="[0-9]{1,4}:[0-5][0-9]:[0-5][0-9]"></label>
<div class="tools"><button type="button" id="editCancel">キャンセル</button><button class="primary">保存</button></div>
</form>
</dialog>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const storageId = 'basho-techo-v1';
const count = 20;
const blankPage = () => ({date:'', time:'', memo:'', view:null, marks:[], strokes:[]});
const encode = bytes => btoa(Array.from(new Uint8Array(bytes), byte => String.fromCharCode(byte)).join(''));
const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
const textEncoder = new TextEncoder();
let key, salt, pages, index = 0, lastSaved, pending = Promise.resolve();
let map, marksLayer, strokesLayer, applyingView = false, marking = false, undo, gesture;
let requests = new Map();
const strokeStyle = {color:"#b89269", weight:4, opacity:0.9, interactive:false};
let stroke = null;
let daily = {}, watch = null;
let attempted = new Set();
let session = 0;

async function derive(password, salt) {
  const material = await crypto.subtle.importKey('raw', textEncoder.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:decode(salt), iterations:600000, hash:'SHA-256'},
    material, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function save() {
  const snapshot = textEncoder.encode(JSON.stringify({pages, daily, watch}));
  const saveKey = key;
  const saveSalt = salt;
  $('saveStatus').textContent = '保存中…';
  pending = pending.catch(() => {}).then(async () => {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({name:'AES-GCM', iv}, saveKey, snapshot);
    if (localStorage.getItem(storageId) !== lastSaved) throw new Error('storage changed');
    const record = JSON.stringify({salt:saveSalt, iv:encode(iv), data:encode(data)});
    localStorage.setItem(storageId, record);
    lastSaved = record;
    $('saveStatus').textContent = '';
  }).catch(error => {
    $('saveStatus').textContent = '保存できませんでした。別のタブや端末の保存設定をご確認ください。';
    throw error;
  });
  pending.catch(() => {});
  return pending;
}
function showGate() {
  $('gate').hidden = false;
  $('book').hidden = true;
  $('password').value = $('repeat').value = '';
  try {
    lastSaved = localStorage.getItem(storageId);
    const existing = lastSaved !== null;
    $('intro').textContent = existing ? 'パスワードを入力して手帳を開きます。' :
      '半角英字4文字と半角数字4桁でパスワードを設定してください。順番は自由です。忘れると内容を復元できません。 iPhone、Android端末、iPadなどでは、手帳のデータは端末ごとに保存されます。端末間でデータを同期したり、移したりすることはできません。';
    $('repeatLabel').hidden = existing;
    $('repeat').required = !existing;
    $('password').autocomplete = existing ? 'current-password' : 'new-password';
    $('enter').textContent = existing ? '手帳を開く' : '手帳を作る';
    if (!globalThis.crypto?.subtle) throw new Error('https');
  } catch {
    $('gateStatus').textContent = '暗号化と保存を使えるよう、SafariでHTTPSのページとして開いてください。';
    $('enter').disabled = true;
  }
}
$('access').onsubmit = async event => {
  event.preventDefault();
  $('gateStatus').textContent = '';
  const password = $('password').value;
  const registrationFormat = /^(?=(?:[0-9]*[A-Za-z]){4}[0-9]*$)[A-Za-z0-9]{8}$/;
  if (lastSaved === null && !registrationFormat.test(password)) {
    $('gateStatus').textContent = '半角英字4文字と半角数字4桁を入力してください。';
    return;
  }
  if (lastSaved === null && password !== $('repeat').value) {
    $('gateStatus').textContent = 'パスワードが一致しません。';
    return;
  }
  $('enter').disabled = true;
  try {
    const record = lastSaved === null ? null : JSON.parse(lastSaved);
    salt = record ? record.salt : encode(crypto.getRandomValues(new Uint8Array(16)));
    key = await derive(password, salt);
    if (record) {
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:decode(record.iv)}, key, decode(record.data));
      const saved = JSON.parse(new TextDecoder().decode(plain));
      pages = Array.isArray(saved) ? saved : saved.pages;
      daily = saved.daily || {};
      watch = saved.watch || null;
    } else {
      daily = {};
      watch = null;
      pages = Array.from({length:count}, blankPage);
      await save();
    }
    $('password').value = $('repeat').value = '';
    $('gate').hidden = true;
    $('book').hidden = false;
    showPage(0);
    renderWatch();
  } catch {
    key = pages = null;
    $('gateStatus').textContent = lastSaved === null ? '手帳を保存できませんでした。' : '手帳を開けませんでした。パスワードをご確認ください。';
  } finally {
    $('enter').disabled = false;
  }
};
$('lock').onclick = async () => {
  $('lock').disabled = true;
  $('book').inert = true;
  session++;
  requests.clear();
  try {
    await pending;
  } catch {
    $('lock').disabled = false;
    $('book').inert = false;
    return;
  }
  setDrawing(false);
  attempted.clear();
  undo = key = pages = watch = null;
  daily = {};
  if (map) map.remove();
  map = marksLayer = strokesLayer = null;
  $('memo').value = $('date').value = $('time').value = '';
  $('lock').disabled = false;
  showGate();
  $('book').inert = false;
};

function startMap() {
  if (map) return true;
  if (!globalThis.L) {
    $('mapStatus').textContent = '地図を読み込めませんでした。通信を確認して再読み込みしてください。';
    return false;
  }
  map = L.map('map', {zoomControl:true, maxZoom:19});
  const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  tiles.on('tileerror', () => {
    if (!$('mapStatus').textContent) $('mapStatus').textContent = '地図画像を読み込めませんでした。通信をご確認ください。';
  });
  strokesLayer = L.layerGroup().addTo(map);
  marksLayer = L.layerGroup().addTo(map);
  map.on('zoomend', () => marksLayer.eachLayer(updateMarkSize));
  map.on('moveend', () => {
    if (applyingView || !pages) return;
    const center = map.getCenter();
    pages[index].view = [center.lat, center.lng, map.getZoom()];
    requests.delete(index);
    $('mapStatus').textContent = '';
    save();
  });
  map.on('click', event => {
    if (!marking) return;
    const point = event.latlng.wrap();
    const center = map.getCenter();
    pages[index].view ||= [center.lat, center.lng, map.getZoom()];
    requests.delete(index);
    pages[index].marks.push({lat:point.lat, lng:point.lng, color:$('color').value});
    setMarking(false);
    drawMarks();
    refreshClear();
    save();
  });
  return true;
}
function setView(view) {
  applyingView = true;
  try {
    map.stop();
    map.closePopup();
    map.invalidateSize({pan:false, debounceMoveend:false});
    map.setView(view.slice(0,2), view[2], {animate:false});
  } finally {
    applyingView = false;
  }
}
function updateMarkSize(marker) {
  const steps = Math.min(3, Math.max(0, map.getMaxZoom() - map.getZoom()));
  marker.setRadius(12 - steps * 3);
  marker.setStyle({weight:4 - steps * 0.75, fill:steps === 3, fillOpacity:1});
}
function drawMarks() {
  if (!marksLayer) return;
  marksLayer.clearLayers();
  const current = pages[index];
  for (const mark of current.marks) {
    const marker = L.circleMarker([mark.lat, mark.lng], {
      color:mark.color, bubblingMouseEvents:false
    }).addTo(marksLayer);
    updateMarkSize(marker);
    const remove = document.createElement('button');
    remove.textContent = 'この印を消す';
    remove.onclick = () => {
      current.marks = current.marks.filter(item => item !== mark);
      drawMarks();
      refreshClear();
      save();
    };
    marker.bindPopup(remove);
  }
}
function setMarking(on) {
  marking = on;
  $('mark').setAttribute('aria-pressed', String(on));
  $('mapStatus').textContent = on ? '地図をタップして丸印を付けます。' : '';
}
function locate() {
  if (!map) return;
  setDrawing(false);
  if (!navigator.geolocation) {
    $('mapStatus').textContent = 'この環境では現在地を取得できません。';
    return;
  }
  const target = index;
  const token = Symbol();
  const activeSession = session;
  attempted.add(target);
  requests.set(target, token);
  $('mapStatus').textContent = '現在地を取得中…';
  const isCurrent = () => session === activeSession && requests.get(target) === token;
  navigator.geolocation.getCurrentPosition(({coords}) => {
    if (!isCurrent()) return;
    requests.delete(target);
    const view = [coords.latitude, coords.longitude, 16];
    pages[target].view = view;
    if (index === target) {
      setView(view);
      $('mapStatus').textContent = '';
    }
    save();
  }, () => {
    if (!isCurrent()) return;
    requests.delete(target);
    if (index === target) $('mapStatus').textContent = '現在地を取得できませんでした。位置情報の許可を確認するか、地図を手で移動してください。';
  }, {timeout:12000, maximumAge:0});
}
function refreshClear() {
  const current = pages[index];
  $('clear').disabled = !current.memo && !current.marks.length && !current.strokes?.length;
  $('undoStroke').disabled = !current.strokes?.length;
  $('undo').hidden = undo?.index !== index;
}
function showPage(target) {
  if (target < 0 || target >= count) return;
  setDrawing(false);
  if (map) {
    applyingView = true;
    map.stop();
    applyingView = false;
  }
  index = target;
  const current = pages[index];
  $('page').value = index;
  $('prev').disabled = index === 0;
  $('next').disabled = index === count - 1;
  for (const field of ['date','time','memo']) $(field).value = current[field];
  $('memo').scrollTop = 0;
  refreshClear();
  setMarking(false);
  if (!startMap()) return;
  setView(current.view || [38.2682,140.8694,13]);
  drawMarks();
  drawStrokes();
  if (requests.has(index)) $('mapStatus').textContent = '現在地を取得中…';
  else if (!current.view && !attempted.has(index)) locate();
}
for (let n = 0; n < count; n++) $('page').add(new Option(`${n+1} / ${count}`, n));
$('page').onchange = () => showPage(Number($('page').value));
$('prev').onclick = () => showPage(index - 1);
$('next').onclick = () => showPage(index + 1);
for (const surface of [$('nav')]) {
  surface.onpointerdown = event => {
    if (!event.isPrimary || (event.pointerType === 'mouse' && event.target.closest('button, select'))) return;
    gesture = {x:event.clientX, y:event.clientY, id:event.pointerId};
    if (!event.target.closest('button, select')) surface.setPointerCapture(event.pointerId);
  };
  surface.onpointerup = event => {
    if (!gesture || gesture.id !== event.pointerId) return;
    const dx = event.clientX - gesture.x;
    const dy = event.clientY - gesture.y;
    gesture = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) showPage(index + (dx < 0 ? 1 : -1));
  };
  surface.onpointercancel = () => { gesture = null; };
}
$('locate').onclick = locate;
$('mark').onclick = () => {
  if (!map) return;
  setDrawing(false);
  setMarking(!marking);
};

function drawStrokes() {
  if (!strokesLayer) return;
  strokesLayer.clearLayers();
  for (const points of pages[index].strokes || []) L.polyline(points, strokeStyle).addTo(strokesLayer);
}
function finishStroke(commit) {
  if (!stroke) return;
  const {points, line, pointer} = stroke;
  stroke = null;
  const surface = $('drawSurface');
  if (surface.hasPointerCapture(pointer)) surface.releasePointerCapture(pointer);
  if (!commit || points.length < 2) {
    line.remove();
    return;
  }
  const current = pages[index];
  (current.strokes ||= []).push(points);
  const center = map.getCenter();
  current.view ||= [center.lat, center.lng, map.getZoom()];
  refreshClear();
  save();
}
function setDrawing(on) {
  const surface = $('drawSurface');
  if (!on && surface.hidden) return;
  if (on) {
    setMarking(false);
    requests.delete(index);
    map.stop();
    map.closePopup();
  } else {
    finishStroke(false);
  }
  surface.hidden = !on;
  $('draw').setAttribute('aria-pressed', String(on));
  $('mapStatus').textContent = on ? '指で描く。もう一度「線」を押すと地図を動かせます。' : '';
}
$('draw').onclick = () => { if (map) setDrawing($('drawSurface').hidden); };
$('undoStroke').onclick = () => {
  finishStroke(false);
  pages[index].strokes.pop();
  drawStrokes();
  refreshClear();
  save();
};
const surface = $('drawSurface');
surface.onpointerdown = event => {
  if (!map || stroke || !event.isPrimary || event.button !== 0) return;
  event.stopPropagation();
  surface.setPointerCapture(event.pointerId);
  stroke = {pointer:event.pointerId, points:[], line:L.polyline([], strokeStyle).addTo(strokesLayer)};
  addStrokePoint(event);
};
function addStrokePoint(event, minimumDistance = 0) {
  const point = map.mouseEventToContainerPoint(event);
  if (stroke.last && (stroke.last.equals(point) || stroke.last.distanceTo(point) < minimumDistance)) return;
  const {lat, lng} = map.containerPointToLatLng(point);
  stroke.points.push([Number(lat.toFixed(7)), Number(lng.toFixed(7))]);
  stroke.last = point;
  stroke.line.addLatLng([lat, lng]);
}
surface.onpointermove = event => {
  if (stroke?.pointer === event.pointerId) addStrokePoint(event, 2);
};
surface.onpointerup = event => {
  if (stroke?.pointer !== event.pointerId) return;
  addStrokePoint(event);
  finishStroke(true);
};
surface.onpointercancel = surface.onlostpointercapture = event => {
  if (stroke?.pointer === event.pointerId) finishStroke(false);
};
for (const type of ['touchstart','mousedown','click','dblclick','wheel','contextmenu']) {
  surface.addEventListener(type, event => {
    event.stopPropagation();
    if (type === 'contextmenu' || type === 'wheel') event.preventDefault();
  }, {passive:false});
}
for (const field of ['date','time','memo']) {
  $(field).oninput = () => {
    pages[index][field] = $(field).value;
    if (field === 'memo' && undo?.index === index) undo = null;
    refreshClear();
    save();
  };
}
const two = value => String(value).padStart(2, '0');
function dateKey(date) {
  return `${date.getFullYear()}-${two(date.getMonth()+1)}-${two(date.getDate())}`;
}
function duration(seconds) {
  return [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(two).join(':');
}
for (const field of ['date','time']) {
  $(field).addEventListener('click', () => {
    if ($(field).value) return;
    const now = new Date();
    pages[index][field] = $(field).value = field === 'date' ? dateKey(now) : `${two(now.getHours())}:${two(now.getMinutes())}`;
    save();
  });
}
function elapsed(now = Date.now()) {
  return watch ? watch.milliseconds + (watch.started === null ? 0 : Math.max(0, now - watch.started)) : 0;
}
function renderWatch() {
  $('timerReadout').textContent = duration(Math.floor(elapsed() / 1000));
  $('timerStart').textContent = !watch ? '始め' : watch.started === null ? '再開' : '停止';
  $('timerEnd').disabled = !watch;
}
setInterval(() => { if (watch?.started != null && pages) renderWatch(); }, 200);
$('timerStart').onclick = () => {
  const now = Date.now();
  if (!watch) watch = {date:dateKey(new Date(now)), milliseconds:0, started:now};
  else if (watch.started === null) watch.started = now;
  else {
    watch.milliseconds = elapsed(now);
    watch.started = null;
  }
  renderWatch();
  save();
};
$('timerEnd').onclick = () => {
  if (!watch || !window.confirm('本当に終了しますか？')) return;
  const day = watch.date;
  daily[day] = (daily[day] || 0) + Math.floor(elapsed() / 1000);
  watch = null;
  renderWatch();
  save();
};

let editingDay;
function editDay(day) {
  editingDay = day;
  $('editDate').textContent = `${day} の記録を修正`;
  $('editDuration').value = duration(daily[day] || 0);
  $('recordEdit').showModal();
}
function bindDay(button, day) {
  let press, origin;
  const cancel = () => clearTimeout(press);
  button.onpointerdown = event => {
    if (!event.isPrimary || event.button !== 0) return;
    origin = [event.clientX, event.clientY];
    press = setTimeout(() => editDay(day), 550);
  };
  button.onpointermove = event => {
    if (origin && Math.hypot(event.clientX - origin[0], event.clientY - origin[1]) > 10) cancel();
  };
  button.onpointerup = button.onpointercancel = button.onpointerleave = cancel;
  button.oncontextmenu = event => event.preventDefault();
  button.onclick = event => { if (event.detail === 0 && !$('recordEdit').open) editDay(day); };
}
function renderRecords() {
  const month = $('recordMonth').value;
  if (!month) return;
  const [year, number] = month.split('-').map(Number);
  const last = new Date(year, number, 0).getDate();
  const days = $('recordDays');
  days.replaceChildren();
  let total = 0;
  for (let day = 1; day <= last; day++) {
    const key = `${month}-${two(day)}`;
    const seconds = daily[key] || 0;
    total += seconds;
    const button = document.createElement('button');
    const label = document.createElement('span');
    label.textContent = `${day}日`;
    button.append(label, duration(seconds));
    bindDay(button, key);
    days.append(button);
  }
  $('recordTotal').textContent = `月の合計  ${duration(total)}`;
}
$('recordsLink').onclick = () => {
  const selected = $('recordMonth');
  selected.value = dateKey(new Date()).slice(0, 7);
  renderRecords();
  $('records').showModal();
};
$('recordsClose').onclick = () => $('records').close();
$('recordMonth').oninput = renderRecords;
$('editCancel').onclick = () => $('recordEdit').close();
$('editForm').onsubmit = event => {
  event.preventDefault();
  const [hours, minutes, seconds] = $('editDuration').value.split(':').map(Number);
  daily[editingDay] = hours * 3600 + minutes * 60 + seconds;
  $('recordEdit').close();
  renderRecords();
  save();
};
$('clear').onclick = () => {
  $('clearText').textContent = `本当に消去しますか？ ${index+1}ページ目のメモ・丸印・手書き線が消えます。`;
  $('confirmClear').returnValue = 'cancel';
  $('confirmClear').showModal();
};
$('confirmClear').onclose = () => {
  if ($('confirmClear').returnValue !== 'clear') return;
  const current = pages[index];
  setDrawing(false);
  undo = {index, memo:current.memo, marks:current.marks, strokes:current.strokes || []};
  current.memo = $('memo').value = '';
  current.marks = [];
  current.strokes = [];
  drawMarks();
  drawStrokes();
  refreshClear();
  save();
};
$('undo').onclick = () => {
  if (undo?.index !== index) return;
  pages[index].memo = $('memo').value = undo.memo;
  pages[index].marks = [...undo.marks, ...pages[index].marks];
  pages[index].strokes = [...undo.strokes, ...pages[index].strokes];
  drawStrokes();
  undo = null;
  drawMarks();
  refreshClear();
  save();
};
addEventListener('DOMContentLoaded', showGate);
</script>
</html>
